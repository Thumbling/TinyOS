name: TinyOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Simulator and UI screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator and render all screens
        run: make shots HOSTCC=cc AR=ar
      - name: Run headless emulator self-test
        run: make emulator-selftest HOSTCC=cc AR=ar
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-ui
          path: |
            build/home.png
            docs/ui-*.png
          if-no-files-found: error

  image:
    name: Buildroot SD image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl device-tree-compiler \
            dosfstools e2fsprogs file flex git libelf-dev libncurses-dev \
            libssl-dev mtools patch perl pkg-config python3 \
            python3-setuptools rsync tar unzip wget xz-utils

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-2025.02.3-${{ hashFiles('buildroot-external/configs/tinyos_rg_nano_defconfig') }}
          restore-keys: |
            buildroot-dl-2025.02.3-

      - name: Build complete image
        run: |
          set -o pipefail
          sh scripts/build-image.sh 2>&1 | tee build.log

      - name: Summarise build failure
        if: failure()
        run: |
          echo '### Buildroot log tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 120 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-build-log
          path: build.log
          if-no-files-found: warn

      - name: Compress and checksum image
        run: |
          cd output/images
          xz -T0 -6 -f tinyos-rg-nano.img
          sha256sum tinyos-rg-nano.img.xz > tinyos-rg-nano.img.xz.sha256
          ls -lh tinyos-rg-nano.img.xz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-rg-nano-image
          path: |
            output/images/tinyos-rg-nano.img.xz
            output/images/tinyos-rg-nano.img.xz.sha256
            output/images/boot.scr
          if-no-files-found: error
