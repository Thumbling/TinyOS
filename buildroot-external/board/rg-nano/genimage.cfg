image boot.vfat {
    vfat {
        label = "TINYOS_BOOT"
        files = {
            "zImage",
            "sun8i-v3s-anbernic-rg-nano.dtb",
            "boot.scr",
        }
    }
    size = 64M
}

image data.vfat {
    vfat {
        label = "TINYOS_DATA"
        files = {
            "data-readme.txt",
        }
    }
    size = 256M
}

image tinyos-rg-nano.img {
    hdimage {
        partition-table-type = "mbr"
    }

    partition spl {
        in-partition-table = "no"
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
    }

    partition boot {
        partition-type = 0x0c
        bootable = true
        image = "boot.vfat"
        offset = 1M
        size = 64M
    }

    partition root {
        partition-type = 0x83
        image = "rootfs.ext4"
        size = 512M
    }

    partition data {
        partition-type = 0x0c
        image = "data.vfat"
        size = 256M
    }
}
